# Snyk Code (static analysis of the C sources): runs on each push to main and weekly.
# The findings go to the run's "Snyk Code results" artifact (SARIF); the job fails only when the scan itself fails.
name: Snyk Code

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  snyk-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - name: Scan with Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # Exit 1 means issues were found and snyk.sarif holds them; 2 and 3 mean the scan failed.
        run: snyk code test --sarif-file-output=snyk.sarif || [ $? -eq 1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Snyk Code results
          path: snyk.sarif
          retention-days: 30
