# OpenSSF Scorecard: scores this repository's security practices weekly and on each push to main,
# and publishes the result to api.scorecard.dev for the README's badge.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard results
          path: results.sarif
          retention-days: 5
