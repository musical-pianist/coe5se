# Builds the DLLs and dylibs from src/ for each pull request to dev, with release.yml's pinned compilers.
name: build

on:
  pull_request:
    branches: [dev]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TC_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
      TC_SHA256: bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21
      TC_DIR: llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64
      ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      ZIG_DIR: zig-x86_64-linux-0.16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Refuse executables
        run: |
          git diff -z --name-only --diff-filter=AM HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          python3 - "$RUNNER_TEMP/changed" <<'PY'
          import sys
          OTHERS = (b"\x7fELF", b"\xfe\xed\xfa\xce", b"\xfe\xed\xfa\xcf", b"\xce\xfa\xed\xfe", b"\xcf\xfa\xed\xfe", b"\xca\xfe\xba\xbe")
          def is_executable(data):
              if data[:2] == b"MZ" and len(data) >= 0x40:
                  pe = int.from_bytes(data[0x3c:0x40], "little")
                  return data[pe:pe + 4] == b"PE\0\0"
              return data[:4].startswith(OTHERS)
          paths = [x for x in open(sys.argv[1], "rb").read().decode().split("\0") if x]
          found = [x for x in paths if is_executable(open(x, "rb").read())]
          if found:
              sys.exit("This pull request adds executables, which CONTRIBUTING.md doesn't take: " + ", ".join(found))
          PY
      - name: Download the pinned compilers
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -sS -o tc.tar.xz "$TC_URL"
          curl -fL --retry 3 -sS -o zig.tar.xz "$ZIG_URL"
          echo "$TC_SHA256  tc.tar.xz" | shasum -a 256 -c
          echo "$ZIG_SHA256  zig.tar.xz" | shasum -a 256 -c
          tar -xf tc.tar.xz
          tar -xf zig.tar.xz
      - name: Build the DLLs and dylibs from src/
        run: |
          export CC="$RUNNER_TEMP/$TC_DIR/bin/x86_64-w64-mingw32-clang"
          export WINDRES="$RUNNER_TEMP/$TC_DIR/bin/x86_64-w64-mingw32-windres"
          export ZIG="$RUNNER_TEMP/$ZIG_DIR/zig"
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-cache" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          "$CC" --version | head -1
          echo "zig $("$ZIG" version)"
          src/build.sh
          src/build_mac.sh
